apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictor
  namespace: endpoint-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: predictor
  template:
    metadata:
      labels:
        app: predictor
    spec:
      containers:
        - name: predictor
          image: predictor:local
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: "local"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: predictor
  namespace: endpoint-lab
spec:
  selector:
    app: predictor
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
